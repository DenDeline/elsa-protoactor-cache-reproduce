{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "elsa-protoactor-repro.fullname" . }}
  labels:
    {{- include "elsa-protoactor-repro.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "elsa-protoactor-repro.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "elsa-protoactor-repro.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
